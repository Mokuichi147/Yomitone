[package]
name = "yomitone-app"
description = "小説の登場人物ごとに声を変えて読み上げる (デスクトップアプリ)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "yomitone_app"

[[bin]]
name = "yomitone-app"
path = "src/main.rs"

[dependencies]
dirs = "6"
indexmap = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
naui = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yomitone.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.6.0"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
